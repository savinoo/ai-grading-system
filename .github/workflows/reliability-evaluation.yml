name: Reliability Evaluation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/llm-reliability-evaluation
      - feat/reliability-lab-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m compileall -q app/experiment_store.py app/experiment_provenance.py evaluation/ tests/
      - name: Run standard-library regression and evaluation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
