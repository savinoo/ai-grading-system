name: CI

on:
  push:
    branches: [main, feat/reliability-lab-complete]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      LANGSMITH_TRACING: "false"
      LANGSMITH_TRACING_ENABLED: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
      - name: Install offline lab and test dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check fatal Python correctness errors across inherited source
        run: ruff check src/ app/ evaluation/ tests/
      - name: Check formatting of integration tests
        run: ruff format --check tests/integration_*.py
      - name: Validate Python syntax
        run: python -m compileall -q src/ app/ evaluation/ tests/
      - name: Run regressions and actual LangGraph integration with mocked providers
        run: pytest --cov=src/domain/ai/workflow --cov=src/services/agents --cov=app.experiment_store --cov=evaluation --cov-report=xml --cov-report=term-missing tests/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned scanner
        run: python -m pip install 'bandit[toml]==1.9.4'
      - name: Run all default Bandit checks without suppressions
        run: bandit -r src/ app/ evaluation/ -c pyproject.toml -f json -o bandit-report.json
      - name: Preserve findings even when the scan fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ai-grading-system .
      - name: Verify image built successfully
        run: docker image inspect ai-grading-system
